uae40\ub3d9\uc6d0 \u2194 \uc870\uad6d\ud604 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=76\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\ubd80\uc758\uc7a5 \uae40\ub3d9\uc6d0 \u2194 \uc870\uad6d\ud604 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=76\ud68c\u003cextra\u003e\u003c\u002fextra\u003e",null,"\uc774\uc9c4\uc218 \uc758\uc6d0 \u2194 \uc870\uad6d\ud604 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=21\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\uc774\uc9c4\uc218 \uc758\uc6d0 \u2194 \uc870\uad6d\ud604 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=21\ud68c\u003cextra\u003e\u003c\u002fextra\u003e",null,"\ubd80\uc758\uc7a5 \uae40\ub3d9\uc6d0 \u2194 \uc870\uc601\uaddc \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=36\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\ubd80\uc758\uc7a5 \uae40\ub3d9\uc6d0 \u2194 \uc870\uc601\uaddc \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=36\ud68c\u003cextra\u003e\u003c\u002fextra\u003e",null,"\uc870\uad6d\ud604 \uc758\uc6d0 \u2194 \uc870\ud5cc\uc601 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=15\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\uc870\uad6d\ud604 \uc758\uc6d0 \u2194 \uc870\ud5cc\uc601 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=15\ud68c\u003cextra\u003e\u003c\u002fextra\u003e",null,"\uae40\uc0c1\ub3c8 \uc758\uc6d0 \u2194 \ubd80\uc758\uc7a5 \uae40\ub3d9\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=40\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\uae40\uc0c1\ub3c8 \uc758\uc6d0 \u2194 \ubd80\uc758\uc7a5 \uae40\ub3d9\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=40\ud68c\u003cextra\u003e\u003c\u002fextra\u003e",null,"\ubc15\uc21c\uc11d \uc758\uc6d0 \u2194 \uc774\uc9c4\uc218 \uc758\uc6d0\u003cbr\u003e\uc5f0\uc18d \ubc1c\uc5b8 \uc5f0\uacb0=8\ud68c\u003cextra\u003e\u003c\u002fextra\u003e","\ubc15\uc21c\uc11d \uc758\uc6d0 \u2194 \uc774\
